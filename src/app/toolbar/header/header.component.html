<mat-toolbar
  style="max-width: 100%; padding: 0px; background-color: #ecedf4"
  class="maintoolbar"
>
  <div class="logo1">
     <span  *ngIf="!sessionService.getLogoState()">
      <img src="../../../assets/pharmamart.png"class="pharmamart-logo"/>
    </span> 
    <span *ngIf="sessionService.getLogoState()">
      <img src="../../../assets/logo2.jpeg" style="height: 57px; width: 319px;" />
    </span>
  </div>
  <div class="logo3" *ngIf="this.cookieService.get('isLogo') == 'true'">
    <div
      style="margin-left: 180%"
      *ngIf="this.cookieService.get('isLogin') == 'loginSuccess'"
    >
      <img [src]="logoURL" alt="Logo" style="height: 77px; width: 200px" />
    </div>
  </div>
  <div class="logo2">
    <span>
      <div class="Top-rightid">
        <table
          cellpadding="0"
          cellspacing="0"
          *ngIf="this.cookieService.get('isLogin') == 'loginSuccess'"
        >
          <tr>
            <td>
              <div class="userid_title">
                <mat-icon matSuffix>account_circle</mat-icon> &nbsp;
              </div>
            </td>
            <td>
              <div class="userid_title" [matMenuTriggerFor]="userMenu">
                {{ this.cookieService.get("userId") }}
              </div>
            </td>
          </tr>
        </table>
        <mat-menu #userMenu="matMenu" style="background-color: #474668">
          <!-- <button mat-menu-item *ngFor="let action of toolbarActions" (click)="onAction(action)"> -->
          <button mat-menu-item>
            <span>Change Password</span>
          </button>
          <button mat-menu-item>
            <span>Log Out </span>
          </button>

          <span class="margin-left_15">{{ cookieService.get("buCode") }}</span>
        </mat-menu>
      </div>
    </span>
  </div>
</mat-toolbar>
<mat-toolbar style="max-height: 41px !important;"
  class="toolbar"
  *ngIf="this.cookieService.get('isLogin') == 'loginSuccess'"
>
  <div class="menu-template">
    <button mat-button class="menu white-button-label" style="color: white !important;" class="basic">
      Home
    </button>

    <!-- <button
      *ngIf="this.cookieService.get('subMenuFlag') == 'true'"
      mat-button style="color: white !important;"
      [matMenuTriggerFor]="belowMenu"
    >
      {{ this.cookieService.get("menuHeader") }}
    </button> -->
    <!-- <mat-menu #belowMenu="matMenu" yPosition="below" class="dropdown1" >
      <button class="mat-menu-item" style=" color: #fff;text-align: start;" (click)="submenu1(this.cookieService.get('subMenu1'))">{{this.cookieService.get('subMenu1')}}</button>
    </mat-menu> -->
    <mat-menu #belowMenu="matMenu" yPosition="below" class="dropdown1">
      <div *ngFor="let submenu of this.lifeCycleDataService.subMenuList">
        <button
          class="mat-menu-item "
          style="color: #fff; text-align: start"
          (click)="onSelectSubMenu(submenu.lcrole, submenu.stage)"
        >
          {{ submenu.lcrole }}
        </button>
      </div>
    </mat-menu>
  </div>
</mat-toolbar>
