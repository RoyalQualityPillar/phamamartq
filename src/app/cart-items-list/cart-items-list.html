<div class="table-box tabOverFlowX">
  <mat-table [dataSource]="curtItemsListData" matSort id="dataTable" class="table_background_color">
          <ng-container matColumnDef="ff0001">
      <mat-header-cell *matHeaderCellDef mat-sort-header>
        Product Order Code
      </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.uc0001 }} </mat-cell>
    </ng-container>
     <ng-container matColumnDef="ff0002">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Organisation Code
      </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.ff0011 }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="ff0003">
      <mat-header-cell *matHeaderCellDef mat-sort-header>SaleUnit Code
      </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.ff0012 }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="ff0004">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Mail ID
      </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.ff0017 }} </mat-cell>
    </ng-container>    

    <ng-container matColumnDef="ff0006">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Total Amount
      </mat-header-cell>
      <mat-cell *matCellDef="let row">{{ row.ff0009 }}</mat-cell>
    </ng-container>
    
    <ng-container matColumnDef="createdon">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Created Date
      </mat-header-cell>
      <mat-cell *matCellDef="let row">
        {{ row.createdon }}
      </mat-cell>
    </ng-container>
    <ng-container matColumnDef="createdby">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Created By
      </mat-header-cell>
      <mat-cell *matCellDef="let row">
        {{ row.createdby }}
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="action">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Action
      </mat-header-cell>
      <mat-cell *matCellDef="let row">
        <mat-icon class="cursor" (click)="submit(row)" > toggle_on </mat-icon>
      </mat-cell>
    </ng-container>   

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
  </mat-table>

  <mat-paginator [pageSizeOptions]="[10, 15, 20, 25]" (page)="pageChanged($event)" showFirstLastButtons
    aria-label="Select page of periodic rows">
  </mat-paginator>
</div>
